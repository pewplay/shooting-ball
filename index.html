<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shooting Ball</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icon.png" type="image/png">
</head>
<body>
  <div class="hud"><span>Score: </span><span id="scoreEl">0</span></div>
  <div id="modalEl" class="modal">
    <div class="modal__box">
      <h1 id="bigScoreEl" class="modal__score">0</h1>
      <p class="modal__label">Points</p>
      <p class="modal__help">Click or tap to shoot the red balls before they reach you.<br>Touch a yellow ball to blast every enemy on screen.</p>
      <button id="startgameBtn" class="modal__btn" type="button">Start</button>
    </div>
  </div>
  <canvas></canvas>
  <script src="script.js"></script>
</body>
</html>
